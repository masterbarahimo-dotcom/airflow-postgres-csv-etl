services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_password
      POSTGRES_DB: employees_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d employees_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    build: .
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: employees_db
      PGUSER: etl_user
      PGPASSWORD: etl_password
    volumes:
      # Persist standalone Airflow metadata and local configuration.
      - airflow_home:/opt/airflow
      # Keep DAG code and CSV editable on the host.
      - ./dags:/opt/airflow/dags:ro
      - ./data:/opt/airflow/data:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  airflow_home:
